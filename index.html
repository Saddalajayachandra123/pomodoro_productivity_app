<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Productivity App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍅 Pomodoro Timer</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <span class="theme-icon">🌙</span>
            </button>
        </header>

        <main>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="focus">Focus</button>
                <button class="mode-btn" data-mode="short">Short Break</button>
                <button class="mode-btn" data-mode="long">Long Break</button>
            </div>

            <div class="timer-wrapper">
                <div class="apple-icon">⏳</div>
                <div class="timer-container">
                    <svg class="progress-ring" width="300" height="300">
                        <circle class="progress-ring-circle" stroke="#e0e0e0" stroke-width="8" fill="transparent" r="140" cx="150" cy="150"/>
                        <circle class="progress-ring-bar" stroke="#4CAF50" stroke-width="8" fill="transparent" r="140" cx="150" cy="150"/>
                    </svg>
                    <div class="timer-display">
                        <div class="time" id="timeDisplay">25:00</div>
                        <div class="session-label" id="sessionLabel">Focus Session</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn start-btn" id="startBtn">Start</button>
                <button class="control-btn pause-btn hidden" id="pauseBtn">Pause</button>
                <button class="control-btn reset-btn" id="resetBtn">Reset</button>
            </div>

            <div class="task-section">
                <label for="taskInput">Current Task:</label>
                <input type="text" id="taskInput" placeholder="What are you working on?" maxlength="50">
                <div class="current-task" id="currentTask"></div>
            </div>

            <div class="progress-section">
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-value" id="completedSessions">0</span>
                        <span class="stat-label">Completed</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="totalTime">0</span>
                        <span class="stat-label">Minutes</span>
                    </div>
                </div>
            </div>
        </main>

        <div class="notification hidden" id="notification">
            <p id="notificationText">Session Complete! 🎉</p>
        </div>
    </div>
